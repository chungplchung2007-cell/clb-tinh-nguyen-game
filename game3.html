<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Game 3: Đào Vàng Gây Quỹ - Ban Tài Chính</title>
  <meta name="description" content="Mini-game đào vàng gây quỹ tình nguyện của Ban Tài Chính - CLB Tình Nguyện Trường Y." />

  <!-- Google Fonts: Be Vietnam Pro & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div id="app-container">
    <!-- Top Bar -->
    <header class="top-bar">
      <a href="index.html" class="club-brand" title="Về trang chủ">
        <div class="club-logo-badge">❤</div>
        <div class="club-title-wrap">
          <h1 id="brand-name">CLB TÌNH NGUYỆN TRƯỜNG Y</h1>
          <p>Ban Tài chính</p>
        </div>
      </a>

      <div class="top-actions">
        <button class="btn-icon" id="btn-sound-toggle" title="Bật/Tắt âm thanh" aria-label="Âm thanh">
          <span id="sound-icon">🔊</span>
        </button>
        <a href="index.html#section-select" class="btn-icon" title="Chọn ban khác" aria-label="Chọn ban">
          <span>📋</span>
        </a>
      </div>
    </header>

    <!-- Game Arena -->
    <main class="game-arena">
      <div class="game-hud">
        <div class="hud-title">💰 Đào Vàng Gây Quỹ Tình Nguyện</div>
        <div class="hud-stats">
          <span class="hud-pill" id="miner-level-hud">Màn 1</span>
          <span class="hud-pill" id="miner-gold-hud">Vàng: $0 / $650</span>
          <span class="hud-pill" id="miner-time-hud">⏱ 60s</span>
        </div>
      </div>

      <div class="canvas-wrapper">
        <canvas id="canvas-miner" width="800" height="460"></canvas>
      </div>

      <!-- Nút thả móc di động -->
      <div class="mobile-controls-row">
        <button id="btn-miner-drop" class="btn-mobile-ctrl">
          <span>⚡ PHÓNG MÓC CÂU (CLICK / SPACE)</span>
        </button>
      </div>

      <div class="btn-group-dual" style="margin-top: 10px;">
        <a href="index.html#section-select" class="btn-secondary">Quay lại chọn ban</a>
        <a href="index.html" class="btn-secondary">Về trang chủ</a>
      </div>
    </main>
  </div>

  <!-- Modal thông báo kết quả -->
  <div id="game-modal" class="modal-backdrop">
    <div class="modal-card">
      <div class="modal-icon" id="modal-icon">🎉</div>
      <h3 class="modal-title" id="modal-title">Kết quả</h3>
      <p class="modal-message" id="modal-desc">Nội dung thông báo...</p>
      
      <div class="modal-stat-box" id="modal-stat-box"></div>

      <div class="modal-buttons">
        <button id="btn-modal-action" class="btn-primary">Tiếp tục</button>
        <a href="index.html" class="btn-secondary">Về trang chủ</a>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/bg-remover.js"></script>

  <script>
    class MinerGameApp {
      constructor() {
        this.canvas = document.getElementById('canvas-miner');
        this.ctx = this.canvas.getContext('2d');
        this.levelHud = document.getElementById('miner-level-hud');
        this.goldHud = document.getElementById('miner-gold-hud');
        this.timeHud = document.getElementById('miner-time-hud');

        this.animId = null;
        this.timerId = null;
        this.isRunning = false;

        this.currentLevelIdx = 0;
        this.currentGold = 0;
        this.timeLeft = 60;

        // Sprite thợ mỏ áo đỏ đã tách nền
        this.minerSprite = null;

        this.origin = { x: 400, y: 72 };
        this.hook = {
          angle: 0,
          angleSpeed: 0.035,
          angleDir: 1,
          baseLength: 48,
          currentLength: 48,
          maxLength: 420,
          state: 'swing', // 'swing' | 'shoot' | 'rewind'
          caughtItem: null,
          speed: 9.5
        };

        this.items = [];

        // Lắng nghe phóng móc
        window.addEventListener('keydown', (e) => {
          if (e.code === 'Space' || e.key === 'ArrowDown') {
            e.preventDefault();
            this.dropHook();
          }
        });

        this.canvas.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          this.dropHook();
        });

        document.getElementById('btn-miner-drop').addEventListener('pointerdown', (e) => {
          e.preventDefault();
          this.dropHook();
        });
      }

      async init() {
        try {
          this.minerSprite = await BackgroundRemover.loadTransparent('assets/miner.jpg');
        } catch (e) {
          console.log("Dùng đồ họa procedural thợ mỏ");
        }
        this.start(0);
      }

      start(levelIndex = 0) {
        this.currentLevelIdx = levelIndex;
        const config = window.GOLD_LEVELS[this.currentLevelIdx] || window.GOLD_LEVELS[0];
        this.currentGold = 0;
        this.timeLeft = config.time;
        this.isRunning = true;

        this.resetHook();
        this.spawnItems();
        this.updateHud();

        if (this.animId) cancelAnimationFrame(this.animId);
        if (this.timerId) clearInterval(this.timerId);

        this.timerId = setInterval(() => {
          if (!this.isRunning) return;
          this.timeLeft--;
          this.updateHud();
          if (this.timeLeft <= 0) {
            this.handleTimeUp();
          }
        }, 1000);

        this.loop();
      }

      stop() {
        this.isRunning = false;
        if (this.animId) cancelAnimationFrame(this.animId);
        if (this.timerId) clearInterval(this.timerId);
      }

      resetHook() {
        this.hook.state = 'swing';
        this.hook.currentLength = this.hook.baseLength;
        this.hook.caughtItem = null;
      }

      dropHook() {
        if (!this.isRunning) return;
        if (this.hook.state === 'swing') {
          this.hook.state = 'shoot';
          window.sound.playClick();
        }
      }

      spawnItems() {
        this.items = [];
        const w = this.canvas.width;
        const h = this.canvas.height;

        // Vàng nhỏ
        for (let i = 0; i < 4; i++) {
          this.items.push({
            x: 80 + Math.random() * (w - 160),
            y: 160 + Math.random() * (h - 220),
            radius: 16,
            value: 100,
            weight: 1.2,
            type: 'gold-sm'
          });
        }

        // Vàng vừa
        for (let i = 0; i < 3; i++) {
          this.items.push({
            x: 80 + Math.random() * (w - 160),
            y: 190 + Math.random() * (h - 250),
            radius: 25,
            value: 250,
            weight: 2.2,
            type: 'gold-md'
          });
        }

        // Vàng lớn
        for (let i = 0; i < 2; i++) {
          this.items.push({
            x: 90 + Math.random() * (w - 180),
            y: 230 + Math.random() * (h - 280),
            radius: 36,
            value: 500,
            weight: 4.5,
            type: 'gold-lg'
          });
        }

        // Đá tảng
        for (let i = 0; i < 3; i++) {
          this.items.push({
            x: 80 + Math.random() * (w - 160),
            y: 180 + Math.random() * (h - 240),
            radius: 30,
            value: 20,
            weight: 5.5,
            type: 'rock'
          });
        }

        // Túi may mắn bí ẩn
        this.items.push({
          x: 100 + Math.random() * (w - 200),
          y: 200 + Math.random() * (h - 260),
          radius: 20,
          value: Math.floor(120 + Math.random() * 450),
          weight: 1.5,
          type: 'bag'
        });
      }

      updateHud() {
        const config = window.GOLD_LEVELS[this.currentLevelIdx] || { target: 650 };
        this.levelHud.textContent = `Màn ${this.currentLevelIdx + 1}`;
        this.goldHud.textContent = `Vàng: $${this.currentGold} / $${config.target}`;
        this.timeHud.textContent = `⏱ ${this.timeLeft}s`;
      }

      loop() {
        if (!this.isRunning) return;
        this.update();
        this.draw();
        this.animId = requestAnimationFrame(() => this.loop());
      }

      update() {
        const h = this.hook;

        if (h.state === 'swing') {
          h.angle += h.angleSpeed * h.angleDir;
          if (h.angle > 1.25) {
            h.angle = 1.25;
            h.angleDir = -1;
          } else if (h.angle < -1.25) {
            h.angle = -1.25;
            h.angleDir = 1;
          }
        } else if (h.state === 'shoot') {
          h.currentLength += h.speed;

          const hookX = this.origin.x + Math.sin(h.angle) * h.currentLength;
          const hookY = this.origin.y + Math.cos(h.angle) * h.currentLength;

          // Chạm mép canvas
          if (
            hookX < 20 || hookX > this.canvas.width - 20 ||
            hookY > this.canvas.height - 20 ||
            h.currentLength >= h.maxLength
          ) {
            h.state = 'rewind';
          }

          // Va chạm với vật thể
          for (let i = 0; i < this.items.length; i++) {
            const it = this.items[i];
            const dist = Math.hypot(hookX - it.x, hookY - it.y);
            if (dist < it.radius + 12) {
              window.sound.playClick();
              h.caughtItem = it;
              this.items.splice(i, 1);
              h.state = 'rewind';
              break;
            }
          }
        } else if (h.state === 'rewind') {
          const weightFactor = h.caughtItem ? h.caughtItem.weight : 0.8;
          const rewindSpeed = Math.max(2.5, h.speed / weightFactor);
          h.currentLength -= rewindSpeed;

          if (h.caughtItem) {
            h.caughtItem.x = this.origin.x + Math.sin(h.angle) * h.currentLength;
            h.caughtItem.y = this.origin.y + Math.cos(h.angle) * h.currentLength;
          }

          if (h.currentLength <= h.baseLength) {
            if (h.caughtItem) {
              window.sound.playCoin();
              this.currentGold += h.caughtItem.value;
              this.updateHud();
            }
            this.resetHook();
          }
        }
      }

      draw() {
        const w = this.canvas.width;
        const h = this.canvas.height;
        this.ctx.clearRect(0, 0, w, h);

        // Nền mặt đất bên trên
        this.ctx.fillStyle = '#fff0eb';
        this.ctx.fillRect(0, 0, w, 110);

        // Lòng đất
        const earthGrad = this.ctx.createLinearGradient(0, 110, 0, h);
        earthGrad.addColorStop(0, '#7f4f24');
        earthGrad.addColorStop(1, '#582f0e');
        this.ctx.fillStyle = earthGrad;
        this.ctx.fillRect(0, 110, w, h - 110);

        // Đường mặt đất
        this.ctx.strokeStyle = '#936639';
        this.ctx.lineWidth = 4;
        this.ctx.beginPath();
        this.ctx.moveTo(0, 110);
        this.ctx.lineTo(w, 110);
        this.ctx.stroke();

        // Vẽ các vật thể dưới đất
        this.items.forEach(it => this.drawItem(it));
        if (this.hook.caughtItem) {
          this.drawItem(this.hook.caughtItem);
        }

        // Vẽ dây câu
        const hookTipX = this.origin.x + Math.sin(this.hook.angle) * this.hook.currentLength;
        const hookTipY = this.origin.y + Math.cos(this.hook.angle) * this.hook.currentLength;

        this.ctx.strokeStyle = '#2b2d42';
        this.ctx.lineWidth = 2.5;
        this.ctx.beginPath();
        this.ctx.moveTo(this.origin.x, this.origin.y);
        this.ctx.lineTo(hookTipX, hookTipY);
        this.ctx.stroke();

        // Vẽ đầu móc
        this.ctx.save();
        this.ctx.translate(hookTipX, hookTipY);
        this.ctx.rotate(-this.hook.angle);
        this.ctx.fillStyle = '#495057';
        this.ctx.beginPath();
        this.ctx.arc(0, 0, 6, 0, Math.PI * 2);
        this.ctx.fill();

        this.ctx.strokeStyle = '#343a40';
        this.ctx.lineWidth = 3.5;
        this.ctx.beginPath();
        this.ctx.arc(-8, 6, 8, -Math.PI * 0.4, Math.PI * 0.5);
        this.ctx.stroke();
        this.ctx.beginPath();
        this.ctx.arc(8, 6, 8, Math.PI * 0.5, Math.PI * 1.4);
        this.ctx.stroke();
        this.ctx.restore();

        // Vẽ thợ mỏ
        this.drawMiner();
      }

      drawItem(it) {
        this.ctx.save();
        if (it.type.startsWith('gold')) {
          this.ctx.fillStyle = '#ffb703';
          this.ctx.strokeStyle = '#fb8500';
          this.ctx.lineWidth = 3;
          this.ctx.beginPath();
          this.ctx.arc(it.x, it.y, it.radius, 0, Math.PI * 2);
          this.ctx.fill();
          this.ctx.stroke();

          this.ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
          this.ctx.beginPath();
          this.ctx.arc(it.x - it.radius * 0.35, it.y - it.radius * 0.35, it.radius * 0.3, 0, Math.PI * 2);
          this.ctx.fill();
        } else if (it.type === 'rock') {
          this.ctx.fillStyle = '#6c757d';
          this.ctx.strokeStyle = '#495057';
          this.ctx.lineWidth = 3;
          this.ctx.beginPath();
          this.ctx.arc(it.x, it.y, it.radius, 0, Math.PI * 2);
          this.ctx.fill();
          this.ctx.stroke();
        } else if (it.type === 'bag') {
          this.ctx.fillStyle = '#e63946';
          this.ctx.beginPath();
          this.ctx.arc(it.x, it.y, it.radius, 0, Math.PI * 2);
          this.ctx.fill();
          this.ctx.fillStyle = '#ffffff';
          this.ctx.font = 'bold 16px sans-serif';
          this.ctx.textAlign = 'center';
          this.ctx.fillText('?', it.x, it.y + 5);
        }
        this.ctx.restore();
      }

      drawMiner() {
        const ox = this.origin.x;
        const oy = this.origin.y;

        // Bệ kéo máy móc
        this.ctx.fillStyle = '#343a40';
        this.ctx.fillRect(ox - 35, oy - 12, 70, 16);

        // Bánh xe
        this.ctx.fillStyle = '#adb5bd';
        this.ctx.beginPath();
        this.ctx.arc(ox - 24, oy + 4, 7, 0, Math.PI * 2);
        this.ctx.arc(ox + 24, oy + 4, 7, 0, Math.PI * 2);
        this.ctx.fill();

        if (this.minerSprite) {
          // Vẽ sprite nhân vật thợ mỏ đã tách nền
          this.ctx.drawImage(this.minerSprite, ox - 26, oy - 62, 52, 52);
        } else {
          // Thợ mỏ áo đỏ tình nguyện procedural
          this.ctx.fillStyle = '#e63946';
          this.ctx.beginPath();
          this.ctx.roundRect(ox - 15, oy - 46, 30, 32, 6);
          this.ctx.fill();

          this.ctx.fillStyle = '#ffffff';
          this.ctx.fillRect(ox - 3, oy - 38, 6, 14);
          this.ctx.fillRect(ox - 8, oy - 34, 16, 6);

          this.ctx.fillStyle = '#ffdfba';
          this.ctx.beginPath();
          this.ctx.arc(ox, oy - 54, 11, 0, Math.PI * 2);
          this.ctx.fill();

          this.ctx.fillStyle = '#ffb703';
          this.ctx.beginPath();
          this.ctx.arc(ox, oy - 58, 12, Math.PI, Math.PI * 2);
          this.ctx.fill();
        }
      }

      handleTimeUp() {
        this.stop();
        const config = window.GOLD_LEVELS[this.currentLevelIdx] || { target: 650 };
        const modal = document.getElementById('game-modal');
        const modalIcon = document.getElementById('modal-icon');
        const modalTitle = document.getElementById('modal-title');
        const modalDesc = document.getElementById('modal-desc');
        const modalStat = document.getElementById('modal-stat-box');
        const actionBtn = document.getElementById('btn-modal-action');

        if (this.currentGold >= config.target) {
          window.sound.playWin();
          const nextLvl = this.currentLevelIdx + 1;
          if (nextLvl < window.GOLD_LEVELS.length) {
            modalIcon.textContent = '🎉';
            modalTitle.textContent = 'Qua màn xuất sắc!';
            modalDesc.innerHTML = `Bạn đã gây quỹ được <strong>$${this.currentGold}</strong> (Mục tiêu: $${config.target})! Sẵn sàng tiến vào màn tiếp theo?`;
            modalStat.innerHTML = `<div>Chặng tiếp: Màn ${nextLvl + 1} - Mục tiêu: $${window.GOLD_LEVELS[nextLvl].target}</div>`;
            actionBtn.textContent = 'Tiến vào màn tiếp theo ➔';
            actionBtn.onclick = () => {
              modal.classList.remove('active');
              this.start(nextLvl);
            };
            modal.classList.add('active');
          } else {
            modalIcon.textContent = '🏆';
            modalTitle.textContent = 'Thần tài Gây quỹ!';
            modalDesc.textContent = 'Chúc mừng bạn đã hoàn thành tất cả các màn chơi gây quỹ tình nguyện của Ban Tài chính!';
            modalStat.innerHTML = `<div>Tổng ngân quỹ gom được: <strong>$${this.currentGold}</strong></div>`;
            actionBtn.textContent = 'Chơi lại từ đầu';
            actionBtn.onclick = () => {
              modal.classList.remove('active');
              this.start(0);
            };
            modal.classList.add('active');
          }
        } else {
          window.sound.playHit();
          modalIcon.textContent = '💔';
          modalTitle.textContent = 'Chưa đạt mục tiêu!';
          modalDesc.innerHTML = `Bạn thu được <strong>$${this.currentGold}</strong> / $${config.target}. Đừng nản lòng, hãy thử lại nào!`;
          modalStat.innerHTML = `<div>Thiếu: <strong>$${config.target - this.currentGold}</strong></div>`;
          actionBtn.textContent = 'Thử sức lại';
          actionBtn.onclick = () => {
            modal.classList.remove('active');
            this.start(this.currentLevelIdx);
          };
          modal.classList.add('active');
        }
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      const game = new MinerGameApp();
      game.init();
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Game 4: Quản Lý Nhân Lực - Ban Hành Chính & Nhân Sự</title>
  <meta name="description" content="Mini-game chạy 3 làn chiêu mộ nhân sự áo đỏ kiểu Zombie Tsunami của Ban Hành Chính - Nhân Sự." />

  <!-- Google Fonts: Be Vietnam Pro & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div id="app-container">
    <!-- Top Bar -->
    <header class="top-bar">
      <a href="index.html" class="club-brand" title="Về trang chủ">
        <div class="club-logo-badge">❤</div>
        <div class="club-title-wrap">
          <h1 id="brand-name">CLB TÌNH NGUYỆN TRƯỜNG Y</h1>
          <p>Ban Hành chính - Nhân sự</p>
        </div>
      </a>

      <div class="top-actions">
        <button class="btn-icon" id="btn-sound-toggle" title="Bật/Tắt âm thanh" aria-label="Âm thanh">
          <span id="sound-icon">🔊</span>
        </button>
        <a href="index.html#section-select" class="btn-icon" title="Chọn ban khác" aria-label="Chọn ban">
          <span>📋</span>
        </a>
      </div>
    </header>

    <!-- Game Arena -->
    <main class="game-arena">
      <div class="game-hud">
        <div class="hud-title">🤝 Chiêu Mộ Đội Ngũ Áo Đỏ (3 Làn)</div>
        <div class="hud-stats">
          <span class="hud-pill" id="squad-count-hud">Nhân lực: 3</span>
          <span class="hud-pill" id="squad-peak-hud">Cao nhất: 3</span>
          <span class="hud-pill" id="squad-total-hud">Đã tuyển: 0</span>
        </div>
      </div>

      <div class="canvas-wrapper">
        <canvas id="canvas-squad" width="800" height="340"></canvas>
      </div>

      <!-- Phím đổi làn di động -->
      <div class="mobile-controls-row">
        <button id="btn-lane-up" class="btn-mobile-ctrl">
          <span>⬆ LÀN TRÊN (▲ / W)</span>
        </button>
        <button id="btn-lane-down" class="btn-mobile-ctrl">
          <span>⬇ LÀN DƯỚI (▼ / S)</span>
        </button>
      </div>

      <div class="btn-group-dual" style="margin-top: 10px;">
        <a href="index.html#section-select" class="btn-secondary">Quay lại chọn ban</a>
        <a href="index.html" class="btn-secondary">Về trang chủ</a>
      </div>
    </main>
  </div>

  <!-- Modal thông báo kết quả -->
  <div id="game-modal" class="modal-backdrop">
    <div class="modal-card">
      <div class="modal-icon" id="modal-icon">🤝</div>
      <h3 class="modal-title" id="modal-title">Tổng kết Chiêu Mộ Nhân Sự</h3>
      <p class="modal-message" id="modal-desc">Bạn đã dẫn dắt đoàn tình nguyện viên rất cống hiến!</p>
      
      <div class="modal-stat-box" id="modal-stat-box"></div>

      <div class="modal-buttons">
        <button id="btn-modal-replay" class="btn-primary">Chơi lại</button>
        <a href="index.html" class="btn-secondary">Về trang chủ</a>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/bg-remover.js"></script>

  <script>
    class SquadGameApp {
      constructor() {
        this.canvas = document.getElementById('canvas-squad');
        this.ctx = this.canvas.getContext('2d');
        this.squadCountHud = document.getElementById('squad-count-hud');
        this.squadPeakHud = document.getElementById('squad-peak-hud');
        this.squadTotalHud = document.getElementById('squad-total-hud');

        this.animId = null;
        this.isRunning = false;

        // 3 làn đường: 0 (Trên), 1 (Giữa), 2 (Dưới)
        this.lanesY = [85, 170, 255];
        this.currentLane = 1;
        this.targetLane = 1;

        this.squadCount = 3;
        this.peakSquadCount = 3;
        this.totalRecruited = 0;
        this.speed = 5.2;

        this.members = [];
        this.items = [];
        this.spawnTimer = 70;

        // Sprites tự động tách nền
        this.volunteerSprite = null;
        this.candidateSprite = null;

        // Phím di chuyển
        window.addEventListener('keydown', (e) => {
          if (e.code === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
            e.preventDefault();
            this.changeLane(-1);
          } else if (e.code === 'ArrowDown' || e.key === 's' || e.key === 'S') {
            e.preventDefault();
            this.changeLane(1);
          }
        });

        document.getElementById('btn-lane-up').addEventListener('pointerdown', (e) => {
          e.preventDefault();
          this.changeLane(-1);
        });

        document.getElementById('btn-lane-down').addEventListener('pointerdown', (e) => {
          e.preventDefault();
          this.changeLane(1);
        });

        // Hỗ trợ cảm ứng vuốt trên Canvas
        let touchStartY = null;
        this.canvas.addEventListener('touchstart', (e) => {
          if (e.touches && e.touches[0]) {
            touchStartY = e.touches[0].clientY;
          }
        }, { passive: true });

        this.canvas.addEventListener('touchend', (e) => {
          if (touchStartY !== null && e.changedTouches && e.changedTouches[0]) {
            const touchEndY = e.changedTouches[0].clientY;
            const diffY = touchEndY - touchStartY;
            if (diffY < -28) {
              this.changeLane(-1);
            } else if (diffY > 28) {
              this.changeLane(1);
            }
            touchStartY = null;
          }
        });

        document.getElementById('btn-modal-replay').addEventListener('click', () => {
          document.getElementById('game-modal').classList.remove('active');
          this.start();
        });
      }

      async init() {
        try {
          // Tự động tách nền trắng 2 sprite chính
          const [vol, can] = await Promise.all([
            BackgroundRemover.loadTransparent('assets/volunteer.jpg'),
            BackgroundRemover.loadTransparent('assets/candidate.jpg')
          ]);
          this.volunteerSprite = vol;
          this.candidateSprite = can;
        } catch (e) {
          console.log("Dùng đồ họa procedural cho nhân vật");
        }
        this.start();
      }

      start() {
        this.isRunning = true;
        this.currentLane = 1;
        this.targetLane = 1;
        this.squadCount = 3;
        this.peakSquadCount = 3;
        this.totalRecruited = 0;
        this.speed = 5.2;
        this.items = [];
        this.spawnTimer = 60;

        this.initSquadMembers();
        this.updateHud();

        if (this.animId) cancelAnimationFrame(this.animId);
        this.loop();
      }

      stop() {
        this.isRunning = false;
        if (this.animId) cancelAnimationFrame(this.animId);
      }

      initSquadMembers() {
        this.members = [];
        for (let i = 0; i < this.squadCount; i++) {
          this.members.push({
            offsetX: -(i * 26),
            laneY: this.lanesY[this.currentLane],
            bounceAngle: i * 0.4
          });
        }
      }

      changeLane(delta) {
        if (!this.isRunning) return;
        const newLane = this.targetLane + delta;
        if (newLane >= 0 && newLane <= 2) {
          this.targetLane = newLane;
          window.sound.playClick();
        }
      }

      updateHud() {
        this.squadCountHud.textContent = `Nhân lực: ${this.squadCount}`;
        this.squadPeakHud.textContent = `Cao nhất: ${this.peakSquadCount}`;
        this.squadTotalHud.textContent = `Đã tuyển: ${this.totalRecruited}`;
      }

      loop() {
        if (!this.isRunning) return;
        this.update();
        this.draw();
        this.animId = requestAnimationFrame(() => this.loop());
      }

      update() {
        this.speed += 0.0008;

        const targetY = this.lanesY[this.targetLane];
        this.members.forEach((m) => {
          m.laneY += (targetY - m.laneY) * 0.22;
          m.bounceAngle += 0.35;
        });

        // Sinh vật phẩm hoặc ứng viên
        this.spawnTimer--;
        if (this.spawnTimer <= 0) {
          const lane = Math.floor(Math.random() * 3);
          const isCandidate = Math.random() > 0.45;

          this.items.push({
            lane: lane,
            x: this.canvas.width + 40,
            y: this.lanesY[lane],
            type: isCandidate ? 'candidate' : 'obstacle'
          });

          this.spawnTimer = Math.floor(52 + Math.random() * 45);
        }

        const leaderX = 140;

        // Xử lý va chạm
        for (let i = this.items.length - 1; i >= 0; i--) {
          const it = this.items[i];
          it.x -= this.speed;

          const inSameLane = Math.abs(this.members[0].laneY - it.y) < 36;

          if (inSameLane && Math.abs(leaderX - it.x) < 34) {
            if (it.type === 'candidate') {
              // Thu nhận tân binh (+1 nhân lực)
              window.sound.playRecruit();
              this.squadCount++;
              this.totalRecruited++;
              if (this.squadCount > this.peakSquadCount) {
                this.peakSquadCount = this.squadCount;
              }
              this.members.push({
                offsetX: -(this.members.length * 26),
                laneY: this.members[0].laneY,
                bounceAngle: 0
              });
              this.updateHud();
            } else {
              // Va chạm vật cản (-1 hoặc -2 nhân lực)
              window.sound.playHit();
              const loseCount = Math.min(this.squadCount, 1 + (Math.random() > 0.5 ? 1 : 0));
              this.squadCount -= loseCount;
              this.members.splice(-loseCount);
              this.updateHud();

              if (this.squadCount <= 0) {
                this.gameOver();
                return;
              }
            }
            this.items.splice(i, 1);
            continue;
          }

          if (it.x < -60) {
            this.items.splice(i, 1);
          }
        }
      }

      draw() {
        const w = this.canvas.width;
        const h = this.canvas.height;
        this.ctx.clearRect(0, 0, w, h);

        // Nền đường 3 làn
        this.ctx.fillStyle = '#fff9f7';
        this.ctx.fillRect(0, 0, w, h);

        this.lanesY.forEach((ly, idx) => {
          this.ctx.fillStyle = idx % 2 === 0 ? 'rgba(255, 235, 225, 0.45)' : 'rgba(255, 245, 240, 0.45)';
          this.ctx.fillRect(0, ly - 40, w, 80);

          this.ctx.strokeStyle = '#ffd6cc';
          this.ctx.lineWidth = 2;
          this.ctx.setLineDash([16, 16]);
          this.ctx.beginPath();
          this.ctx.moveTo(0, ly + 40);
          this.ctx.lineTo(w, ly + 40);
          this.ctx.stroke();
          this.ctx.setLineDash([]);
        });

        // Vẽ items
        this.items.forEach(it => {
          if (it.type === 'candidate') {
            this.drawCandidate(it.x, it.y);
          } else {
            // Chướng ngại vật
            this.ctx.fillStyle = '#c1121f';
            this.ctx.beginPath();
            this.ctx.roundRect(it.x - 14, it.y - 18, 28, 36, 6);
            this.ctx.fill();
            this.ctx.fillStyle = 'white';
            this.ctx.font = 'bold 12px sans-serif';
            this.ctx.textAlign = 'center';
            this.ctx.fillText('⚠️', it.x, it.y + 4);
          }
        });

        // Vẽ các thành viên đoàn áo đỏ
        const baseX = 140;
        this.members.forEach((m, idx) => {
          this.drawVolunteer(baseX + m.offsetX, m.laneY, m.bounceAngle, idx === 0);
        });
      }

      drawCandidate(x, y) {
        this.ctx.save();
        if (this.candidateSprite) {
          this.ctx.drawImage(this.candidateSprite, x - 22, y - 36, 44, 48);
          this.ctx.font = '12px sans-serif';
          this.ctx.textAlign = 'center';
          this.ctx.fillText('🙋', x, y - 42);
        } else {
          // Procedural
          this.ctx.fillStyle = '#118ab2';
          this.ctx.beginPath();
          this.ctx.roundRect(x - 10, y - 16, 20, 24, 4);
          this.ctx.fill();

          this.ctx.fillStyle = '#ffdfba';
          this.ctx.beginPath();
          this.ctx.arc(x, y - 24, 8, 0, Math.PI * 2);
          this.ctx.fill();

          this.ctx.font = '12px sans-serif';
          this.ctx.textAlign = 'center';
          this.ctx.fillText('🙋', x, y - 34);
        }
        this.ctx.restore();
      }

      drawVolunteer(x, y, bounceAngle, isLeader = false) {
        this.ctx.save();

        // Bóng đổ
        this.ctx.fillStyle = "rgba(0,0,0,0.1)";
        this.ctx.beginPath();
        this.ctx.ellipse(x, y + 16, 12, 4, 0, 0, Math.PI * 2);
        this.ctx.fill();

        const bounce = Math.sin(bounceAngle) * 3;

        if (this.volunteerSprite) {
          this.ctx.drawImage(this.volunteerSprite, x - 22, y - 34 + bounce, 44, 48);
          if (isLeader) {
            this.ctx.font = '12px sans-serif';
            this.ctx.textAlign = 'center';
            this.ctx.fillText('⭐', x, y - 42 + bounce);
          }
        } else {
          // Procedural
          const swing = Math.sin(bounceAngle) * 8;
          this.ctx.strokeStyle = '#2b2d42';
          this.ctx.lineWidth = 3;
          this.ctx.beginPath();
          this.ctx.moveTo(x - 4, y + 6);
          this.ctx.lineTo(x - 4 - swing, y + 16);
          this.ctx.moveTo(x + 4, y + 6);
          this.ctx.lineTo(x + 4 + swing, y + 16);
          this.ctx.stroke();

          this.ctx.fillStyle = isLeader ? '#c1121f' : '#e63946';
          this.ctx.beginPath();
          this.ctx.roundRect(x - 11, y - 16, 22, 24, 5);
          this.ctx.fill();

          this.ctx.fillStyle = '#ffffff';
          this.ctx.fillRect(x - 2, y - 12, 4, 12);
          this.ctx.fillRect(x - 6, y - 8, 12, 4);

          this.ctx.fillStyle = '#ffdfba';
          this.ctx.beginPath();
          this.ctx.arc(x, y - 24, 8, 0, Math.PI * 2);
          this.ctx.fill();

          this.ctx.fillStyle = '#c1121f';
          this.ctx.beginPath();
          this.ctx.arc(x, y - 27, 8, Math.PI, Math.PI * 2);
          this.ctx.fill();

          if (isLeader) {
            this.ctx.font = '11px sans-serif';
            this.ctx.textAlign = 'center';
            this.ctx.fillText('⭐', x, y - 36);
          }
        }

        this.ctx.restore();
      }

      gameOver() {
        this.stop();
        window.sound.playHit();

        setTimeout(() => {
          const modal = document.getElementById('game-modal');
          const modalStat = document.getElementById('modal-stat-box');
          modalStat.innerHTML = `
            <div>Tổng số nhân lực kiếm được: <strong>${this.totalRecruited}</strong></div>
            <div>Số nhân lực nhiều nhất trong 1 thời điểm: <strong>${this.peakSquadCount}</strong></div>
          `;
          modal.classList.add('active');
        }, 350);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      const game = new SquadGameApp();
      game.init();
    });
  </script>
</body>
</html>
